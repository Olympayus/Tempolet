name: tempolet
description: "轻量日历 + 提醒/计划 + 备忘录（本地优先，Windows 桌面 v0.1.0）"
publish_to: 'none'

version: 0.1.5+6

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  flutter_local_notifications: ^23.0.1
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  window_manager: ^0.6.0
  tray_manager: ^0.8.3
  launch_at_startup: ^0.5.1
  path_provider: ^2.1.6
  path: ^1.9.1
  lucide_icons_flutter: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

# package:sqlite3 默认从 GitHub Releases 下载预编译库；Windows 上本机网络无法访问
# 该地址，改用 Windows 自带的 winsqlite3.dll（Windows 10+ 系统组件）。Android
# 没有 libsqlite3.so，必须使用下载的预编译库；其他桌面平台维持原有的系统库行为。
hooks:
  user_defines:
    sqlite3:
      source:
        windows: system
        android: sqlite3
        default: system
      name:
        windows: winsqlite3
        default: sqlite3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/tray_icon.ico
    - assets/holidays/2026.json
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
